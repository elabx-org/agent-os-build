name: iOS probe
on:
  push:
    branches: ["ios/probe-paste"]
jobs:
  probe:
    runs-on: xcode-27
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@v5
      - run: sudo xcode-select -s /Applications/Xcode_27.1.app
      - run: xcodebuild -version && xcrun swift --version
      - run: brew install xcodegen && xcodegen generate
      - name: Probe
        run: |
          DEV=$(xcrun simctl list devices available | grep -iE "iPhone" | head -1 | sed -E 's/^ *(.*) \(([0-9A-F-]+)\).*/\2/')
          echo "device $DEV"
          mkdir -p probe-out
          for CONFIG in Debug Release; do
            echo "=== $CONFIG ==="
            xcodebuild test -project AgentOS.xcodeproj -scheme AgentOS -destination "id=$DEV" \
              -only-testing:AgentOSProbe/PasteProbe -configuration $CONFIG ENABLE_TESTABILITY=YES \
              CODE_SIGNING_ALLOWED=NO > probe-out/test-$CONFIG.log 2>&1 || echo "PROBE $CONFIG xcodebuild exit $?"
            grep -E "PROBE|error:|failed|passed|rash|ssumption|isolat" probe-out/test-$CONFIG.log | head -60 || true
          done
          cp ~/Library/Logs/DiagnosticReports/AgentOS* probe-out/ 2>/dev/null || true
          ls probe-out
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: probe
          path: ios/probe-out
