name: iOS probe
on:
  push:
    branches: ["ios/probe"]
jobs:
  probe:
    runs-on: xcode-27
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@v5
      - run: sudo xcode-select -s /Applications/Xcode_27.1.app
      - run: brew install xcodegen && xcodegen generate
      - run: xcrun simctl list devices available | grep -i iphone | head -20
      - name: Probe
        run: |
          DEV=$(xcrun simctl list devices available | grep -iE "iPhone" | head -1 | sed -E 's/^ *(.*) \(([0-9A-F-]+)\).*/\2/')
          echo "device $DEV"
          set -o pipefail
          TEST_RUNNER_PROBE_OUT=$PWD/probe-out xcodebuild test -project AgentOS.xcodeproj -scheme AgentOS -destination "id=$DEV" CODE_SIGNING_ALLOWED=NO 2>&1 | tee test.log | grep -E "PROBE|error|failed|passed"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: probe
          path: ios/probe-out
