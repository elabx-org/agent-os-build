name: iOS column probe
on:
  push:
    branches: ["probe/m14"]
jobs:
  probe:
    runs-on: xcode-27
    strategy:
      fail-fast: false
      matrix:
        device: ["iPhone Duo", "iPhone 18 Pro"]
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@v5
      - run: sudo xcode-select -s /Applications/Xcode_27.1.app
      - run: brew install xcodegen && xcodegen generate
      - name: Probe
        run: |
          DEV=$(xcrun simctl list devices available | grep -F "    ${{ matrix.device }} (" | head -1 | sed -E 's/^ *(.*) \(([0-9A-F-]+)\).*/\2/')
          echo "device $DEV"
          SLUG=$(echo "${{ matrix.device }}" | tr ' ' '-' | tr 'A-Z' 'a-z')
          set -o pipefail
          TEST_RUNNER_PROBE_OUT=$PWD/probe-out TEST_RUNNER_PROBE_DEVICE=$SLUG xcodebuild test -project AgentOS.xcodeproj -scheme AgentOS -destination "id=$DEV" CODE_SIGNING_ALLOWED=NO 2>&1 | tee test.log | grep -E "PROBE|error:|failed|passed"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: probe-${{ strategy.job-index }}
          path: ios/probe-out
